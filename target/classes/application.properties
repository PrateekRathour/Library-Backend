# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=library-management-system

# Active Profile (change to 'mysql' for MySQL database)
spring.profiles.active=dev

# In-Memory H2 Database Configuration for zero-setup instant run
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a6747f3b5849856f6f966160b86a87b5a5b5120377e8a939f604ffb23b129792e3c09033e680d96d744f479a473f3248674d81269fa620f4cbdb54019a712f5
app.jwt.expiration-ms=86400000

# Library Business Rules (Amounts in INR ₹)
library.rules.default-borrow-days=14
library.rules.max-borrow-limit=5
library.rules.fine-per-day=10.00
